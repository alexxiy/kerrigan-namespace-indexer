user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    upstream php-fpm {
        server unix:/run/php/php8.5-fpm-indexer.sock;
    }

    # The list lookups (resolve/reverse, resolve/owner) answer up to 500 names, each with a
    # Merkle proof, so they cost far more than a name lookup. They share one bucket for the
    # whole node, keyed by this map; every other request has an empty key and is not counted.
    # One bucket rather than one per client: behind a TLS proxy every request comes from the
    # proxy's address, and a per-client limit there belongs in that proxy.
    map $uri $list_lookup {
        ~^/v[0-9.]+/resolve/(?:reverse|owner)/  1;
        default                                 "";
    }
    limit_req_zone $list_lookup zone=list_lookups:1m rate=20r/s;

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        root        /opt/kerrigan-name-indexer;

        # The API returns JSON with its own error envelope; a body limit stops an
        # oversized POST from reaching PHP at all.
        client_max_body_size 64k;

        fastcgi_intercept_errors on;
        recursive_error_pages on;

        # Only the versioned API is routable. Everything else — config/, vendor/,
        # resources/, the service scripts — is not reachable over HTTP at all, rather than
        # relying on each file to defend itself.
        location ~ ^/v[0-9] {
            # Readable from any web page, so a browser wallet or web app set to this node
            # can resolve through it. The answers are public and no credentials are involved.
            # `always` puts them on every status, the preflight's 204 included, which takes
            # these too: the `if` below has no add_header of its own.
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age       7200 always;
            # The answers are JSON, and a browser must not take one for anything else (a script
            # or a stylesheet), whatever the data in it looks like.
            add_header X-Content-Type-Options       "nosniff" always;
            if ($request_method = OPTIONS) { return 204; }

            if ($is_args) { return 404; }
            if ($uri ~ '^/.+/+$') { return 404; }

            limit_req        zone=list_lookups burst=40 nodelay;
            limit_req_status 429;

            fastcgi_pass   php-fpm;
            fastcgi_param  SCRIPT_FILENAME  $document_root/api.php;
            include        fastcgi_params;
            fastcgi_param  PHP_VALUE open_basedir="/opt/kerrigan-name-indexer:/tmp:/var/log/indexer";
        }

        location / { return 404; }
    }
}
